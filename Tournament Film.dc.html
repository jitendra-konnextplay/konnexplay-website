<style>
/* The animation tool draws its own control bar over the film: play, restart,
   a scrubber, a running time and an Export video button. That is authoring
   chrome. On a public page it turns a film into a video player, which is the
   opposite of what these are for.

   Export offers a visitor a download of the film. That goes on any screen.

   The rest only goes when the film will actually play by itself. Someone who
   has asked for less movement gets a film that does not move, so taking their
   play button away would leave them looking at one frozen frame. */
[data-omelette-chrome] [title="Export video"] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  [data-omelette-chrome] { display: none !important; }
}
html, body { margin: 0; padding: 0; background: #061428; }</style>
