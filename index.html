<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { route: 'home', arg: '' };
  parse() {
    const raw = (window.location.hash || '#/home').replace(/^#\/?/, '');
    const clean = raw.split('?')[0].replace(/\/$/, '');
    const parts = clean.split('/').filter(Boolean);
    const route = parts[0] || 'home';
    const arg = parts[1] || '';
    this.setState({ route, arg });
    /* The home page is the site's root, so it should read as one. Every other
       route keeps its hash; only '#/home' with nothing after it is tidied away,
       and never when an anchor is being jumped to. */
    if (route === 'home' && !arg && raw.indexOf('a=') === -1 && window.location.hash) {
      try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {}
    }
    [200, 800].forEach(t => setTimeout(() => this.reveal(), t));
    const am = raw.match(/[?&]a=([A-Za-z0-9_-]+)/);
    if (am) {
      const tryScroll = (n) => {
        const el = document.getElementById(am[1]);
        if (el) { window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); }
        else if (n < 12) setTimeout(() => tryScroll(n + 1), 120);
      };
      setTimeout(() => tryScroll(0), 80);
    } else {
      try { window.scrollTo(0, 0); } catch (e) {}
    }
  }
  reveal() {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || !('IntersectionObserver' in window)) return;
    document.documentElement.setAttribute('data-kxmotion', '1');
    if (!this._io) {
      this._io = new IntersectionObserver(es => es.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.setAttribute('data-kxin', '1');
        this._io.unobserve(en.target);
      }), { threshold: 0.12 });
    }
    // only the pages that carry no reveal of their own
    if (document.querySelector('[data-rv]')) return;
    document.querySelectorAll('section > div > *:not([data-kxreveal])').forEach((el, i) => {
      const r = el.getBoundingClientRect();
      if (r.height < 8 || r.height > 1200) return;
      el.setAttribute('data-kxreveal', '1');
      if (r.top < window.innerHeight) el.setAttribute('data-kxin', '1');
      this._io.observe(el);
    });
  }

  componentDidMount() {
    this._h = () => this.parse();
    window.addEventListener('hashchange', this._h);

    this.parse();
    [120, 600, 1400].forEach(t => setTimeout(() => this.reveal(), t));
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this._h); if (this._io) this._io.disconnect(); }
  title(s) { return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }

  /* one title, description and canonical per route — in production each of
     these is its own server-rendered document */
  seo(route, arg, cityName, sportName) {
    const B = ' | KonnexPlay';
    const map = {
      home: ['Sports Venue Booking Software in India', 'Players book and pay online while you run the venue. One live calendar for every court, for box cricket, turf, pickleball, padel and badminton.', ''],
      platform: ['The Platform: One Calendar, Every Court', 'Your own booking website, live slot availability, online payments and advances, one calendar for every court, and the report you open on the 1st.', 'platform'],
      pricing: ['Pricing: ₹12,000 per Court per Year', 'Two plans, neither charging commission on your own bookings. Starter is ₹12,000 per court per year; Pro adds rate plans and tournaments.', 'pricing'],
      demo: ['Book a 20-Minute Demo', 'See KonnexPlay set up on your own courts and rates in twenty minutes: the booking website, the calendar your staff will use, payments and reports.', 'book-a-demo'],
      faq: ['Questions Venue Owners Ask Us', 'How players book without calling, where the money goes, what it costs, how rates and tournaments work, and what KonnexPlay does not do.', 'faq'],
      about: ['About Us', 'Built in Surat by people who ran a box cricket community and lost too many games to a phone nobody answered.', 'about'],
      contact: ['Contact Us', 'Phone and WhatsApp on +91 77788 58901, 9 AM to 11 PM, all days. Or email hello@konnexplay.com.', 'contact'],
      resources: ['Resources for Sports Venue Owners', 'Practical guides on automating venue bookings, filling empty slots, collecting advances, reducing no-shows and increasing repeat bookings.', 'resources'],
      blog: ['Resources for Sports Venue Owners', 'Practical guides on automating venue bookings, filling empty slots, collecting advances, reducing no-shows and increasing repeat bookings.', 'resources'],
      research: ['The 2026 Sports Venue Booking Report', 'Original research on how sports venues in Surat take bookings today, with methodology, findings and limitations stated in full.', 'research/surat-venue-report-2026'],
      'channel-manager': ['Channel Manager (In Development)', 'One booking updates everywhere. The KonnexPlay channel manager is in development; direct bookings through your own booking website work today.', 'channel-manager'],
      india: ['Sports Venue Management Software for India', 'Booking software for sports venues across India: live availability, online payments, one calendar per venue and no commission on your own bookings.', 'sports-venue-management-software-india'],
      legal: ['Privacy, Terms, Cancellation and Refunds', 'KonnexPlay privacy policy, terms of service, and cancellation and refund policy for sports venue owners and players in India.', 'legal']
    };
    let t, d, p;
    if (route === 'city') {
      t = 'Sports Venue Booking Software in ' + cityName;
      d = 'Sports venue management and online booking software for venues in ' + cityName + ': live slots, online payments, one calendar and no commission on your own bookings.';
      p = 'sports-venue-software-' + (arg || 'surat');
    } else if (route === 'sport') {
      t = this.title(arg || 'box-cricket') + ' Booking Software';
      d = sportName + ' venues: let players see live slots, book and pay online, and get confirmed automatically, with one calendar and no commission on your own bookings.';
      p = (arg || 'box-cricket') + '-booking-software';
    } else {
      const m = map[route] || map.home;
      t = m[0]; d = m[1]; p = m[2];
    }
    document.title = t + B;
    const set = (sel, attr, val) => {
      let el = document.head.querySelector(sel);
      if (!el) {
        el = document.createElement(sel.indexOf('link') === 0 ? 'link' : 'meta');
        if (sel.indexOf('link') === 0) el.setAttribute('rel', 'canonical');
        else el.setAttribute(sel.indexOf('property') > -1 ? 'property' : 'name', sel.replace(/.*=["']|["'].*/g, ''));
        document.head.appendChild(el);
      }
      el.setAttribute(attr, val);
    };
    set('meta[name="description"]', 'content', d);
    set('link[rel="canonical"]', 'href', 'https://konnexplay.com/' + p);
    set('meta[property="og:title"]', 'content', t + B);
    set('meta[property="og:description"]', 'content', d);
    set('meta[property="og:url"]', 'content', 'https://konnexplay.com/' + p);
    set('meta[name="twitter:card"]', 'content', 'summary_large_image');
    set('meta[name="twitter:title"]', 'content', t + B);
    set('meta[name="twitter:description"]', 'content', d);
  }
  renderVals() {
    const r = this.state.route;
    const cityMap = { surat: 'Surat', vadodara: 'Vadodara', bharuch: 'Bharuch', valsad: 'Valsad', bangalore: 'Bangalore' };
    const sportMap = { 'box-cricket': 'Box cricket', 'football-turf': 'Football turf', pickleball: 'Pickleball', padel: 'Padel', badminton: 'Badminton', tennis: 'Tennis' };
    const known = ['home','platform','pricing','faq','contact','about','resources','research','india','channel-manager','demo','city','sport','legal','blog'];
    const ALIAS = { 'book-a-demo': 'demo', 'bookademo': 'demo', 'book': 'demo', 'book-demo': 'demo', 'faqs': 'faq', 'price': 'pricing', 'plans': 'pricing', 'blog': 'blog' };
    const rAlias = ALIAS[r] || r;
    const route = known.includes(rAlias) ? rAlias : 'home';
    const cityName = cityMap[this.state.arg] || 'Surat';
    const sportName = sportMap[this.state.arg] || 'Box cricket';
    try { this.seo(route, this.state.arg, cityName, sportName); } catch (e) {}
    return {
      headerSpace: route === 'home' ? '0px' : '77px',
      isHome: route === 'home', isPlatform: route === 'platform', isPricing: route === 'pricing',
      isFaq: route === 'faq', isContact: route === 'contact', isAbout: route === 'about',
      isResources: route === 'resources' || route === 'blog', isResearch: route === 'research', isIndia: route === 'india',
      isChannel: route === 'channel-manager', isDemo: route === 'demo', isLegal: route === 'legal',
      isCity: route === 'city', isSport: route === 'sport',
      cityName: cityName,
      sportName: sportName
    };
  }
}
</script>
